<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobFit Wireframe Prototype</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" data-page="landing">JobFit</button>
    <nav class="nav">
      <button data-page="choose">시작하기</button>
      <button data-page="job-select">직무</button>
      <button data-page="skill-select">기술</button>
      <button data-page="roadmap">로드맵</button>
    </nav>
    <button class="ghost small">내 정보</button>
  </header>

  <main id="app"></main>

  <template id="landing">
    <section class="page hero-page">
      <div class="hero-card">
        <p class="eyebrow">AI 기반 커리어 학습 로드맵</p>
        <h1>JobFit</h1>
        <p class="hero-text">
          관심 직무와 기술을 선택하면 필요한 학습 로드맵, 커리큘럼, 문제 풀이까지 한 번에 제공합니다.
        </p>
        <button class="primary" data-page="choose">시작하기</button>
      </div>
    </section>
  </template>

  <template id="choose">
    <section class="page narrow">
      <div class="section-heading center">
        <p class="eyebrow">학습 시작 방식 선택</p>
        <h2>어떻게 시작할까요?</h2>
        <p>직무 중심으로 필요한 기술을 찾거나, 배우고 싶은 기술을 직접 선택할 수 있습니다.</p>
      </div>
      <div class="choice-grid">
        <article class="choice-card" data-page="job-select">
          <div class="icon-box"></div>
          <h3>직무로 시작하기</h3>
          <p>관심 직무를 선택하면 필요한 기술과 학습 순서를 로드맵으로 확인합니다.</p>
          <button class="primary">직무 선택</button>
        </article>
        <article class="choice-card" data-page="skill-select">
          <div class="icon-box"></div>
          <h3>기술로 시작하기</h3>
          <p>Python, SQL, React처럼 배우고 싶은 기술을 직접 선택합니다.</p>
          <button class="primary">기술 선택</button>
        </article>
      </div>
    </section>
  </template>

  <template id="job-select">
    <section class="page">
      <div class="section-heading center">
        <p class="eyebrow">직무 선택</p>
        <h2>관심 있는 직무를 선택해 주세요</h2>
        <p>직무를 선택하면 상세 설명을 확인한 뒤 학습 로드맵으로 이동할 수 있습니다.</p>
      </div>
      <div class="card-grid" id="jobCards"></div>
    </section>
  </template>

  <template id="job-detail">
    <section class="page">
      <button class="text-button" data-page="job-select">← 직무 목록으로 돌아가기</button>
      <section class="job-hero">
        <div>
          <p class="eyebrow">직무 상세</p>
          <h2 id="jobTitle"></h2>
          <p id="jobSummary"></p>
          <div class="tag-row" id="jobTags"></div>
        </div>
        <div class="placeholder large"></div>
      </section>

      <section class="content-section">
        <h3>직무 특징</h3>
        <div class="info-grid" id="jobFeatures"></div>
      </section>

      <section class="split-section">
        <div class="content-section flush">
          <h3>실제 업무</h3>
          <ul class="task-list" id="jobTasks"></ul>
        </div>
        <div class="content-section flush">
          <h3>주로 사용하는 기술 스택</h3>
          <div class="tag-row" id="jobTechs"></div>
        </div>
      </section>

      <section class="split-section">
        <div class="content-section flush">
          <h3>장점</h3>
          <ul class="check-list" id="jobPros"></ul>
        </div>
        <div class="content-section flush">
          <h3>단점</h3>
          <ul class="check-list warning" id="jobCons"></ul>
        </div>
      </section>

      <div class="sticky-actions">
        <button class="outline" data-page="job-select">다른 직무 보기</button>
        <button class="primary" data-page="roadmap">이 직무 로드맵 보기</button>
      </div>
    </section>
  </template>

  <template id="skill-select">
    <section class="page">
      <div class="section-heading center">
        <p class="eyebrow">기술 선택</p>
        <h2>관심 있는 기술을 선택해 주세요</h2>
        <p>기술을 선택하면 상세 설명과 커리큘럼을 확인할 수 있습니다.</p>
      </div>
      <div class="layout-with-sidebar">
        <aside class="sidebar">
          <h3>필터</h3>
          <label>검색 <input id="skillSearch" type="search" placeholder="기술명 검색" /></label>
          <label>분야
            <select id="skillCategory">
              <option value="all">전체</option>
              <option value="frontend">프론트엔드</option>
              <option value="data">데이터</option>
              <option value="infra">인프라</option>
            </select>
          </label>
        </aside>
        <div class="card-grid" id="skillCards"></div>
      </div>
    </section>
  </template>

  <template id="roadmap">
    <section class="page">
      <div class="section-heading center">
        <p class="eyebrow">직무 기반 로드맵</p>
        <h2>데이터 사이언티스트 기술 로드맵</h2>
        <p>기초부터 실무 활용까지 단계별로 학습할 수 있도록 구성했습니다.</p>
      </div>
      <div class="roadmap-panel">
        <button class="node done" data-skill="Python">Python</button>
        <button class="node done" data-skill="SQL">SQL</button>
        <button class="node progress" data-skill="Pandas">Pandas</button>
        <button class="node" data-skill="Visualization">Visualization</button>
        <button class="node" data-skill="Machine Learning">Machine Learning</button>
        <button class="node" data-skill="Docker">Docker</button>
      </div>
    </section>
  </template>

  <template id="skill-detail">
    <section class="page">
      <button class="text-button" data-page="skill-select">← 기술 목록으로 돌아가기</button>
      <section class="skill-hero">
        <div>
          <p class="eyebrow">기술 상세</p>
          <h2 id="skillTitle">React</h2>
          <p id="skillSummary"></p>
          <button class="primary" data-page="learning">학습 시작</button>
        </div>
        <div class="placeholder hero-image"></div>
      </section>
      <section class="content-section">
        <h3>커리큘럼</h3>
        <div class="curriculum-list" id="curriculumList"></div>
      </section>
    </section>
  </template>

  <template id="learning">
    <section class="page learning-page">
      <aside class="learning-sidebar">
        <h3>목차</h3>
        <button class="active">1. 개념 이해</button>
        <button>2. 기본 문법</button>
        <button>3. 실습</button>
      </aside>
      <article class="learning-content">
        <p class="eyebrow">학습자료</p>
        <h2>현재 학습 중: React Hooks</h2>
        <div class="progress-bar"><span style="width: 60%"></span></div>
        <section class="lesson-card">
          <h3>학습 목표</h3>
          <p>Hooks의 개념을 이해하고, useState와 useEffect를 사용합니다.</p>
        </section>
        <div class="button-row between">
          <button class="outline" data-page="skill-detail">커리큘럼으로 돌아가기</button>
          <button class="primary" data-page="quiz">문제 풀러가기</button>
        </div>
      </article>
    </section>
  </template>

  <template id="quiz">
    <section class="page narrow">
      <div class="section-heading center">
        <p class="eyebrow">문제 풀이</p>
        <h2>프론트엔드 기초: HTML & CSS</h2>
      </div>
      <div class="quiz-card" id="quizCard"></div>
      <div class="button-row between">
        <button class="outline" id="prevQuestion">이전</button>
        <button class="primary" id="submitAnswer">답변 제출</button>
      </div>
    </section>
  </template>

  <template id="result">
    <section class="page narrow">
      <div class="section-heading center">
        <p class="eyebrow">학습 결과</p>
        <h2>문제 풀이 결과 요약</h2>
      </div>
      <div class="result-grid">
        <article class="metric-card"><span>점수</span><strong>8 / 10</strong></article>
        <article class="metric-card"><span>정답</span><strong>8</strong></article>
        <article class="metric-card"><span>오답</span><strong>2</strong></article>
      </div>
      <div class="button-row center">
        <button class="outline" data-page="quiz">다시 풀기</button>
        <button class="primary" data-page="roadmap">로드맵으로 돌아가기</button>
      </div>
    </section>
  </template>

  <script src="./app.js"></script>
</body>
</html>
