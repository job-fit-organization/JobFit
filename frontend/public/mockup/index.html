<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobFit Wireframe Prototype</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" data-page="landing">JobFit</button>
    <nav class="nav">
      <button data-page="choose">시작하기</button>
      <button data-page="job-select">직무</button>
      <button data-page="skill-select">기술</button>
      <button data-page="roadmap">로드맵</button>
    </nav>
    <button class="ghost small">내 정보</button>
  </header>

  <main id="app"></main>

  <template id="landing">
    <section class="page hero-page">
      <div class="hero-card">
        <p class="eyebrow">AI 기반 커리어 학습 로드맵</p>
        <h1>JobFit</h1>
        <p class="hero-text">
          관심 직무와 기술을 선택하면 필요한 학습 로드맵, 커리큘럼, 문제 풀이까지 한 번에 제공합니다.
        </p>
        <button class="primary" data-page="choose">시작하기</button>
      </div>
    </section>
  </template>

  <template id="choose">
    <section class="page narrow">
      <div class="section-heading center">
        <p class="eyebrow">학습 시작 방식 선택</p>
        <h2>어떻게 시작할까요?</h2>
        <p>직무 중심으로 필요한 기술을 찾거나, 배우고 싶은 기술을 직접 선택할 수 있습니다.</p>
      </div>
      <div class="choice-grid">
        <article class="choice-card" data-page="job-select">
          <div class="icon-box"></div>
          <h3>직무로 시작하기</h3>
          <p>관심 직무를 선택하면 필요한 기술과 학습 순서를 로드맵으로 확인합니다.</p>
          <button class="primary">직무 선택</button>
        </article>
        <article class="choice-card" data-page="skill-select">
          <div class="icon-box"></div>
          <h3>기술로 시작하기</h3>
          <p>Python, SQL, React처럼 배우고 싶은 기술을 직접 선택합니다.</p>
          <button class="primary">기술 선택</button>
        </article>
      </div>
    </section>
  </template>

  <template id="job-select">
    <section class="page">
      <div class="section-heading center">
        <p class="eyebrow">직무 선택</p>
        <h2>관심 있는 직무를 선택해 주세요</h2>
        <p>직무를 선택하면 상세 설명을 확인한 뒤 학습 로드맵으로 이동할 수 있습니다.</p>
      </div>
      <div class="card-grid" id="jobCards"></div>
    </section>
  </template>

  <template id="job-detail">
    <section class="page">
      <button class="text-button" data-page="job-select">← 직무 목록으로 돌아가기</button>
      <section class="job-hero">
        <div>
          <p class="eyebrow">직무 상세</p>
          <h2 id="jobTitle"></h2>
          <p id="jobSummary"></p>
          <div class="tag-row" id="jobTags"></div>
        </div>
        <div class="placeholder large"></div>
      </section>

      <section class="content-section">
        <h3>직무 특징</h3>
        <div class="info-grid" id="jobFeatures"></div>
      </section>

      <section class="split-section">
        <div class="content-section flush">
          <h3>실제 업무</h3>
          <ul class="task-list" id="jobTasks"></ul>
        </div>
        <div class="content-section flush">
          <h3>주로 사용하는 기술 스택</h3>
          <div class="tag-row" id="jobTechs"></div>
        </div>
      </section>

      <section class="split-section">
        <div class="content-section flush">
          <h3>장점</h3>
          <ul class="check-list" id="jobPros"></ul>
        </div>
        <div class="content-section flush">
          <h3>단점</h3>
          <ul class="check-list warning" id="jobCons"></ul>
        </div>
      </section>

      <div class="sticky-actions">
        <button class="outline" data-page="job-select">다른 직무 보기</button>
        <button class="primary" data-page="roadmap">이 직무 로드맵 보기</button>
      </div>
    </section>
  </template>

  <template id="skill-select">
    <section class="page">
      <div class="section-heading center">
        <p class="eyebrow">기술 선택</p>
        <h2>관심 있는 기술을 선택해 주세요</h2>
        <p>기술을 선택하면 상세 설명과 커리큘럼을 확인할 수 있습니다.</p>
      </div>
      <div class="layout-with-sidebar">
        <aside class="sidebar">
          <h3>필터</h3>
          <label>검색 <input id="skillSearch" type="search" placeholder="기술명 검색" /></label>
          <label>분야
            <select id="skillCategory">
              <option value="all">전체</option>
              <option value="frontend">프론트엔드</option>
              <option value="data">데이터</option>
              <option value="infra">인프라</option>
            </select>
          </label>
        </aside>
        <div class="card-grid" id="skillCards"></div>
      </div>
    </section>
  </template>

  <template id="roadmap">
    <section class="page">
      <div class="section-heading center">
        <h2 style="font-size: 2.2rem; margin-bottom: 10px;">데이터 사이언티스트<br/>기술 로드맵</h2>
        <p style="margin-bottom: 24px;">핵심 기술을 단계별로 학습하고, 노드를 클릭해 각 기술의 상세 학습 페이지로 이동하세요.</p>
        <div class="button-row center" style="margin-bottom: 40px;">
          <button class="outline" style="min-width: 140px; border-radius: 8px;">순서대로 시작</button>
          <button class="primary" style="min-width: 140px; background: #000; border-radius: 8px;">로드맵 저장</button>
        </div>
      </div>
      
      <div class="roadmap-board">
        <!-- Dashed lines -->
        <div class="r-line h-line" style="top: 38%;"></div>
        <div class="r-line h-line" style="top: 68%;"></div>
        <div class="r-line v-line" style="top: 68%; height: 32%; left: 50%;"></div>
        
        <!-- Badges -->
        <div class="r-badge" style="top: 20px; right: 20px;">공통 기초</div>
        <div class="r-badge" style="top: calc(38% + 20px); right: 20px;">DS 기초</div>
        <div class="r-badge" style="top: calc(68% + 20px); right: calc(50% + 20px);">DS 심화</div>
        <div class="r-badge" style="top: calc(68% + 20px); right: 20px;">공통 심화</div>

        <!-- SVG Arrows -->
        <svg class="r-arrows" width="100%" height="100%">
          <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L0,6 L6,3 z" fill="#ffd700" />
            </marker>
          </defs>
          
          <!-- Python to Pandas & Visualization -->
          <line x1="20%" y1="15%" x2="20%" y2="30%" stroke="#ffd700" stroke-width="3" />
          <line x1="20%" y1="30%" x2="12%" y2="30%" stroke="#ffd700" stroke-width="3" />
          <line x1="20%" y1="30%" x2="28%" y2="30%" stroke="#ffd700" stroke-width="3" />
          <line x1="12%" y1="30%" x2="12%" y2="39%" stroke="#ffd700" stroke-width="3" marker-end="url(#arrowhead)" />
          <line x1="28%" y1="30%" x2="28%" y2="39%" stroke="#ffd700" stroke-width="3" marker-end="url(#arrowhead)" />
          
          <!-- SQL to MySQL & PostgreSQL -->
          <line x1="40%" y1="25%" x2="48%" y2="25%" stroke="#ffd700" stroke-width="3" />
          <line x1="48%" y1="25%" x2="48%" y2="15%" stroke="#ffd700" stroke-width="3" />
          <line x1="48%" y1="25%" x2="48%" y2="30%" stroke="#ffd700" stroke-width="3" />
          <line x1="48%" y1="15%" x2="52%" y2="15%" stroke="#ffd700" stroke-width="3" marker-end="url(#arrowhead)" />
          <line x1="48%" y1="30%" x2="52%" y2="30%" stroke="#ffd700" stroke-width="3" marker-end="url(#arrowhead)" />

          <!-- DS flow -->
          <line x1="12%" y1="45%" x2="12%" y2="54%" stroke="#ffd700" stroke-width="3" marker-end="url(#arrowhead)" />
          <line x1="12%" y1="60%" x2="12%" y2="69%" stroke="#ffd700" stroke-width="3" marker-end="url(#arrowhead)" />
          <line x1="12%" y1="75%" x2="12%" y2="82%" stroke="#ffd700" stroke-width="3" marker-end="url(#arrowhead)" />

          <!-- GitHub to Docker, Linux, AWS -->
          <line x1="75%" y1="28%" x2="75%" y2="78%" stroke="#ffd700" stroke-width="3" />
          <line x1="75%" y1="78%" x2="60%" y2="78%" stroke="#ffd700" stroke-width="3" />
          <line x1="75%" y1="78%" x2="90%" y2="78%" stroke="#ffd700" stroke-width="3" />
          <line x1="60%" y1="78%" x2="60%" y2="82%" stroke="#ffd700" stroke-width="3" marker-end="url(#arrowhead)" />
          <line x1="75%" y1="78%" x2="75%" y2="82%" stroke="#ffd700" stroke-width="3" marker-end="url(#arrowhead)" />
          <line x1="90%" y1="78%" x2="90%" y2="82%" stroke="#ffd700" stroke-width="3" marker-end="url(#arrowhead)" />
        </svg>

        <!-- Nodes -->
        <div class="r-node" style="top: 15%; left: 20%;" data-skill="Python">
          <div class="r-icon">🐍</div><div class="r-label">Python</div>
        </div>
        <div class="r-node" style="top: 25%; left: 40%;" data-skill="SQL">
          <div class="r-icon">🗄️</div><div class="r-label">SQL</div>
        </div>
        <div class="r-node" style="top: 15%; left: 55%;" data-skill="MySQL">
          <div class="r-icon">🐬</div><div class="r-label">MySQL</div>
        </div>
        <div class="r-node" style="top: 30%; left: 55%;" data-skill="PostgreSQL">
          <div class="r-icon">🐘</div><div class="r-label">PostgreSQL</div>
        </div>
        <div class="r-node" style="top: 28%; left: 75%;" data-skill="GitHub">
          <div class="r-icon">🧠</div><div class="r-label">GitHub</div>
        </div>
        <div class="r-node" style="top: 45%; left: 12%;" data-skill="Pandas">
          <div class="r-icon">📊</div><div class="r-label">Pandas</div>
        </div>
        <div class="r-node" style="top: 45%; left: 28%;" data-skill="Visualization">
          <div class="r-icon">🧾</div><div class="r-label">Visualization</div>
        </div>
        <div class="r-node" style="top: 60%; left: 12%;" data-skill="Machine Learning">
          <div class="r-icon">🤖</div><div class="r-label">Machine Learning</div>
        </div>
        <div class="r-node" style="top: 75%; left: 12%;" data-skill="Pytorch">
          <div class="r-icon">🔥</div><div class="r-label">Pytorch</div>
        </div>
        <div class="r-node" style="top: 88%; left: 12%;" data-skill="HuggingFace">
          <div class="r-icon">🤗</div><div class="r-label">HuggingFace</div>
        </div>
        <div class="r-node" style="top: 88%; left: 60%;" data-skill="Docker">
          <div class="r-icon">🐳</div><div class="r-label">Docker</div>
        </div>
        <div class="r-node" style="top: 88%; left: 75%;" data-skill="Linux">
          <div class="r-icon">🐧</div><div class="r-label">Linux</div>
        </div>
        <div class="r-node" style="top: 88%; left: 90%;" data-skill="AWS">
          <div class="r-icon">☁️</div><div class="r-label">AWS</div>
        </div>
      </div>
    </section>
  </template>

  <template id="skill-detail">
    <section class="page">
      <button class="text-button" id="backToSkillBtn" data-page="skill-select">← 기술 목록으로 돌아가기</button>
      <section class="skill-hero">
        <div>
          <p class="eyebrow">기술 상세</p>
          <h2 id="skillTitle">React</h2>
          <p id="skillSummary"></p>
          <button class="primary" data-page="learning">학습 시작</button>
        </div>
        <div class="placeholder hero-image"></div>
      </section>
      <section class="content-section">
        <h3>커리큘럼</h3>
        <div class="curriculum-list" id="curriculumList"></div>
      </section>
    </section>
  </template>

  <template id="learning">
    <section class="page learning-page">
      <aside class="learning-sidebar">
        <h3>목차</h3>
        <button class="active">1. 개념 이해</button>
        <button>2. 기본 문법</button>
        <button>3. 실습</button>
      </aside>
      <article class="learning-content">
        <p class="eyebrow">학습자료</p>
        <h2>현재 학습 중: React Hooks</h2>
        <div class="progress-bar"><span style="width: 60%"></span></div>
        <section class="lesson-card">
          <h3>학습 목표</h3>
          <p>Hooks의 개념을 이해하고, useState와 useEffect를 사용합니다.</p>
        </section>
        <div class="button-row between">
          <button class="outline" data-page="skill-detail">커리큘럼으로 돌아가기</button>
          <button class="primary" data-page="quiz">문제 풀러가기</button>
        </div>
      </article>
    </section>
  </template>

  <template id="quiz">
    <section class="page narrow">
      <div class="section-heading center">
        <p class="eyebrow">문제 풀이</p>
        <h2>프론트엔드 기초: HTML & CSS</h2>
      </div>
      <div class="quiz-card" id="quizCard"></div>
      <div class="button-row between">
        <button class="outline" id="prevQuestion">이전</button>
        <button class="primary" id="submitAnswer">답변 제출</button>
      </div>
    </section>
  </template>

  <template id="result">
    <section class="page narrow">
      <div class="section-heading center">
        <p class="eyebrow">학습 결과</p>
        <h2>문제 풀이 결과 요약</h2>
      </div>
      <div class="result-grid">
        <article class="metric-card"><span>점수</span><strong>8 / 10</strong></article>
        <article class="metric-card"><span>정답</span><strong>8</strong></article>
        <article class="metric-card"><span>오답</span><strong>2</strong></article>
      </div>
      <div class="button-row center">
        <button class="outline" data-page="quiz">다시 풀기</button>
        <button class="primary" data-page="roadmap">로드맵으로 돌아가기</button>
      </div>
    </section>
  </template>

  <script src="./app.js"></script>
</body>
</html>
