version: "3.8"

services:
  # ── pgvector: 벡터 DB + 관계형 DB를 하나의 PostgreSQL 인스턴스에서 관리
  #    - jobfit_pgvector DB : RAG용 임베딩 (pgvector 확장)
  #    - jobfit DB          : 퀴즈·강의자료 등 관계형 데이터
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: jobfit_pgvector
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: jobfit_pgvector        # 기본 DB (벡터용)
    ports:
      - "5432:5432"
    volumes:
      - ./database:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d   # 최초 실행 시 SQL 자동 적용
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
